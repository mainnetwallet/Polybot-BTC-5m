name: Android APK

# Builds the Polybot Android app. Every run uploads an installable APK as a workflow artifact.
# Pushing a tag like app-v1.2.0 also publishes the APKs as a GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    tags: ["app-v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make sure the Android SDK has what the app needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Android 17 (API 37). Package id of the stable platform: android-37.0 (older previews used android-37).
          # If neither can be installed here, AGP downloads the platform itself because the licenses are accepted.
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null \
            || "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" > /dev/null \
            || echo "::warning::sdkmanager could not install the API 37 platform; relying on the Gradle auto-download."

      - name: Compute version
        id: ver
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/app-v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Prepare release signing (only when the secrets exist)
        id: signing
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret: the release APK is signed with the shared debug key."
          fi

      - name: Lint, unit tests, debug and release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            lintDebug testDebugUnitTest assembleDebug assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Show build errors as annotations
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          {
            echo '### Gradle errors'
            echo '```'
            grep -E '^(e: |error: |FAILURE: |\* What went wrong|Execution failed|.*(Unresolved reference|Type mismatch).*)' -A3 "$LOG" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' "$LOG" | head -9 | while IFS= read -r line; do
            echo "::error title=Kotlin compile error::${line//$'\n'/ }"
          done
          grep -A4 -m1 'What went wrong' "$LOG" | tr '\n' ' ' | sed 's/^/::error title=Gradle::/'
          echo

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/polybot-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "../dist/polybot-${{ steps.ver.outputs.name }}-release.apk"
          ls -la ../dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: polybot-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports (lint and tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: polybot-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "Polybot Android ${TAG#app-v}" \
            --generate-notes
