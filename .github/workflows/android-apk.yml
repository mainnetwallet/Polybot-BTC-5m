name: Android APK

# Builds the Polybot Android app. Every run uploads an installable APK as a workflow artifact.
# Pushing a tag like app-v1.2.0 also publishes the APKs as a GitHub Release.

on:
  push:
    branches: [main, android-app]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    tags: ["app-v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make sure the Android SDK has what the app needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compute version
        id: ver
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/app-v}"
          else
            NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Prepare release signing (only when the secrets exist)
        id: signing
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret: the release APK is signed with the shared debug key."
          fi

      - name: Lint, unit tests, debug and release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon --stacktrace
          lintDebug testDebugUnitTest assembleDebug assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.ver.outputs.name }}

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/polybot-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "../dist/polybot-${{ steps.ver.outputs.name }}-release.apk"
          ls -la ../dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: polybot-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports (lint and tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: polybot-apk-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "Polybot Android ${TAG#app-v}" \
            --generate-notes
