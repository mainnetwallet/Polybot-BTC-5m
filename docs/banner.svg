<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Polybot - Polymarket BTC 5m bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#151a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="300" y1="0" x2="300" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="900" y1="0" x2="900" y2="420"/>
  </g>
  <!-- price line running through the banner -->
  <path d="M0 360 L120 345 L220 372 L340 318 L430 335 L560 262 L650 288 L780 205 L870 232 L1010 130 L1100 160 L1200 84 L1200 420 L0 420 Z" fill="url(#area)"/>
  <polyline points="0,360 120,345 220,372 340,318 430,335 560,262 650,288 780,205 870,232 1010,130 1100,160 1200,84"
            fill="none" stroke="url(#line)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- logo mark -->
  <g transform="translate(88 90)">
    <rect width="240" height="240" rx="56" fill="url(#accent)"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="12"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="330 440" transform="rotate(-90 120 120)"/>
    <polyline points="80,140 104,116 122,130 158,92" fill="none" stroke="#ffffff" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="138,89 160,89 160,111" fill="none" stroke="#ffffff" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- title -->
  <text x="376" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="112" fill="#ffffff" letter-spacing="-1">Poly<tspan fill="url(#accent)">bot</tspan></text>
  <text x="380" y="248" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#94a3b8">Polymarket BTC up/down, 5-minute markets</text>
  <!-- chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="1.5" text-anchor="middle" fill="#e2e8f0">
    <rect x="380" y="282" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="464" y="308">PAPER FIRST</text>
    <rect x="562" y="282" width="156" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="640" y="308">LIVE GATED</text>
    <rect x="732" y="282" width="176" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="820" y="308">ANDROID APP</text>
  </g>
</svg>
