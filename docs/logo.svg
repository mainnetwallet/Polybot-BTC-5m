<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Polybot logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#g)"/>
  <!-- 5 minute ring: three quarters filled, the open gap is the time still to run -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="26"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="707 943" transform="rotate(-90 256 256)"/>
  <!-- rising price line -->
  <polyline points="172,300 224,248 262,278 340,196" fill="none" stroke="#ffffff" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="298,190 344,190 344,236" fill="none" stroke="#ffffff" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
